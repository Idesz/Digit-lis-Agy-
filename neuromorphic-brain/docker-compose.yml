version: '3.8'

services:
  brain-core:
    build: .
    container_name: neuromorphic_brain_core
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    depends_on:
      - redis
      - qdrant

  redis:
    image: redis:7-alpine
    container_name: brain_working_memory
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: brain_episodic_memory
    ports:
      - "6333:6333"
